    d='';
  }
  while((m=TOK.exec(stream))!==null){
    if(m[1]!==undefined){ opr.push({s:m[1].replace(/\\([()\\])/g,'$1')}); continue; }
    if(m[3]!==undefined){ opr.push({f:m[3]}); continue; }
    if(m[4]!==undefined){ opr.push(parseFloat(m[4])); continue; }
    var op=m[5];
    switch(op){
      case 'q': stk.push({fill:st.fill,stroke:st.stroke,lw:st.lw,cap:st.cap,join:st.join,fs:st.fs,font:st.font,tx:st.tx,ty:st.ty}); break;
      case 'Q': if(stk.length) st=stk.pop(); break;
      case 'cm': break;
      case 'w': st.lw=opr[0]; break;
      case 'J': st.cap=(['butt','round','square'][opr[0]]||'butt'); break;
      case 'j': st.join=(['miter','round','bevel'][opr[0]]||'miter'); break;
      case 'g': st.fill=gray(opr[0]); break;
      case 'G': st.stroke=gray(opr[0]); break;
      case 'rg': st.fill=rgb(opr); break;
      case 'RG': st.stroke=rgb(opr); break;
      case 'm': d+='M '+opr[0]+' '+opr[1]+' '; break;
      case 'l': d+='L '+opr[0]+' '+opr[1]+' '; break;
      case 'c': d+='C '+opr[0]+' '+opr[1]+' '+opr[2]+' '+opr[3]+' '+opr[4]+' '+opr[5]+' '; break;
      case 'S': paint('s'); break;
      case 'f': paint('f'); break;
      case 'Tf': st.fs=opr[1]; st.font=(opr[0]&&opr[0].f)||'F1'; break;
      case 'Tm': st.tx=opr[4]; st.ty=opr[5]; break;
      case 'Tj': {
        var txt=(opr[0]&&opr[0].s)||'';
        out.push('<text x="'+st.tx+'" y="'+st.ty+'" font-size="'+st.fs+'" font-family="Helvetica,Arial,sans-serif" font-weight="'+
          (st.font==='F2'?'bold':'normal')+'" fill="'+st.fill+'">'+esc(txt)+'</text>');
        break;
      }
    }
    opr=[];
  }
  return '<svg viewBox="0 0 595 842" xmlns="http://www.w3.org/2000/svg"><rect width="595" height="842" fill="#fff"/>'+out.join('')+'</svg>';
}

for(var i=0;i<PAGES.length;i++){ html+='<div class="card">'+toSvg(PAGES[i])+'</div>'; }
host.innerHTML=html;
document.getElementById('note').textContent='6 sayfa olusturuldu. "PDF indir" ile ayni icerigin PDF surumu (A4, 6 sayfa) indirilebilir.';
</script>
